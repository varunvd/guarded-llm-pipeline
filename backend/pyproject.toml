[project]
name = "guarded"
version = "0.1.0"
description = "Reference implementation of a guarded LLM workflow: the model proposes, software decides."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.80",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guarded", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the formatter handles line length; long strings are left alone.
# B008: FastAPI's Depends() in argument defaults is the documented pattern.
ignore = ["E501", "B008"]
