# One command to run everything:  docker compose up --build
# Then open http://localhost:8080
#
# With no .env file this uses the offline simulated model, so no API key is
# needed. To use a real model, copy .env.example to .env and edit it.

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://guarded:guarded@postgres:5432/guarded
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-simulated}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AUTO_SEND: ${AUTO_SEND:-true}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
  PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK:-4.00}
  PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK:-20.00}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guarded
      POSTGRES_PASSWORD: guarded
      POSTGRES_DB: guarded
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guarded"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: ["python", "-m", "guarded.worker"]
    environment: *app-env
    depends_on:
      # The API creates the tables and loads reference data; wait for it.
      api: { condition: service_healthy }

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
